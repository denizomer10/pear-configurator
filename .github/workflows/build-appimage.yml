name: Build and release AppImages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config git curl libusb-1.0-0-dev libssl-dev zlib1g-dev libcurl4-openssl-dev libzip-dev libfontconfig1-dev libfreetype-dev python3-pil squashfs-tools file
      - name: Test
        run: cargo test --locked
      - name: Build Apple restore toolchain
        run: bash scripts/install-toolchain.sh
      - name: Build AppImage
        run: bash scripts/build-appimage.sh
      - name: Smoke test bundled tools
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 dist/PEAR-Configurator-${{ matrix.arch }}.AppImage --version
          LD_LIBRARY_PATH=.appdir/usr/lib .appdir/usr/bin/idevicerestore --version
          LD_LIBRARY_PATH=.appdir/usr/lib .appdir/usr/bin/irecovery --version
      - name: Checksums
        working-directory: dist
        run: sha256sum *.AppImage > SHA256SUMS-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "PEAR Configurator $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
